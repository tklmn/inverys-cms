# Dependency monitoring (see docs/SECURITY-PROCESS.md).
# Security updates are raised as soon as an advisory is published (requires
# "Dependabot security updates" in the repository settings); the weekly run
# below keeps regular version updates flowing in small, reviewable batches.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
