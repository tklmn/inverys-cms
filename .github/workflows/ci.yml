name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, tests, audit
    # composer.lock requires PHP >= 8.4 (Symfony 8.1 / Laravel 13).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, sqlite3, mbstring, openssl, dom, fileinfo, tokenizer, ctype, json, curl
          coverage: none

      - name: Configure Composer GitHub token (avoids API rate limits)
        run: composer config -g github-oauth.github.com "${{ github.token }}"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: English only outside translation files
        run: python3 bin/check-german.py

      - name: Run tests
        run: php artisan test

      - name: Composer security audit
        run: composer audit --no-interaction

  assets:
    name: Front-end build & npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: npm security audit (high+ blocks)
        run: npm audit --audit-level=high

      - name: Build assets
        run: npm run build
