name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, tests, audit
    # composer.lock requires PHP >= 8.4 (Symfony 8.1 / Laravel 13).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, sqlite3, mbstring, openssl, dom, fileinfo, tokenizer, ctype, json, curl
          coverage: none

      - name: Configure Composer GitHub token (avoids API rate limits)
        run: composer config -g github-oauth.github.com "${{ github.token }}"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: English only outside translation files
        run: python3 bin/check-german.py

      - name: Run tests
        run: php artisan test

      - name: Composer security audit
        run: composer audit --no-interaction

  assets:
    name: Front-end build & npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: npm security audit (high+ blocks)
        run: npm audit --audit-level=high

      - name: Build assets
        run: npm run build

  accessibility:
    name: Accessibility (axe-core, WCAG 2.2 AA)
    # Renders the demo content with the default theme in Chromium, light and
    # dark mode, desktop and phone width — fails on any axe violation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, sqlite3, mbstring, openssl, dom, fileinfo, tokenizer, ctype, json, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Configure Composer GitHub token (avoids API rate limits)
        run: composer config -g github-oauth.github.com "${{ github.token }}"

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare demo site (SQLite, demo content, default theme)
        run: |
          cp .env.example .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan storage:link

      - name: Serve the site
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/ && exit 0; sleep 1; done
          cat storage/logs/serve.log; exit 1

      - name: Accessibility check (axe-core)
        env:
          BASE_URL: http://127.0.0.1:8000
          SHOTS: a11y-shots
        run: npm run check:a11y

      - name: Upload screenshots of failing pages
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-screenshots
          path: |
            a11y-shots
            storage/logs
          if-no-files-found: ignore
